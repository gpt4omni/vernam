<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vernam VRNM Logo 02 - BB84 Polarization Prism">
  <defs>
    <linearGradient id="bg02" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071117"/>
      <stop offset="100%" stop-color="#04080C"/>
    </linearGradient>
    <linearGradient id="mint02" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10F5A0"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="facetL02" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="facetR02" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="facetTop02" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10F5A0" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="prismGlow02" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Square Dark Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="url(#bg02)" stroke="#132935" stroke-width="3"/>

  <!-- Subtle Quantum Wave Rings -->
  <circle cx="256" cy="248" r="176" fill="none" stroke="#10F5A0" stroke-width="1" opacity="0.16" stroke-dasharray="6 10"/>
  <circle cx="256" cy="248" r="136" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.14"/>

  <!-- Incoming & Refracted Photon Beams (BB84 Bases + and x) -->
  <g stroke-linecap="round" filter="url(#prismGlow02)">
    <!-- Left Rectilinear Basis (+) -->
    <g stroke="#10F5A0" stroke-width="4">
      <line x1="94" y1="218" x2="134" y2="218"/>
      <line x1="114" y1="198" x2="114" y2="238"/>
    </g>
    <!-- Right Diagonal Basis (x) -->
    <g stroke="#38BDF8" stroke-width="4">
      <line x1="382" y1="202" x2="412" y2="232"/>
      <line x1="412" y1="202" x2="382" y2="232"/>
    </g>
  </g>

  <!-- Faceted Inverted Prism forming a Quantum V -->
  <polygon points="148,142 364,142 256,220" fill="url(#facetTop02)" stroke="url(#mint02)" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="148,142 256,220 256,392" fill="url(#facetL02)" stroke="#6EE7B7" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="364,142 256,220 256,392" fill="url(#facetR02)" stroke="#7DD3FC" stroke-width="2" stroke-linejoin="round"/>

  <!-- Inner Core Cutout (Hollow Quantum Light Channel) -->
  <polygon points="196,172 316,172 256,316" fill="#061017"/>
  <polygon points="214,184 298,184 256,284" fill="none" stroke="url(#mint02)" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Central Photon Node -->
  <circle cx="256" cy="222" r="22" fill="#10F5A0" opacity="0.22"/>
  <circle cx="256" cy="222" r="13" fill="#38BDF8" opacity="0.45"/>
  <circle cx="256" cy="222" r="7.5" fill="#ECFDF5"/>

  <!-- Clean Label -->
  <text x="256" y="446" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="11" fill="#A7F3D0">VERNAM</text>
</svg>
