<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vernam VRNM Logo 04 - One-Time Pad Ribbon V (Gold)">
  <defs>
    <linearGradient id="bg04" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11100E"/>
      <stop offset="100%" stop-color="#070706"/>
    </linearGradient>
    <linearGradient id="goldMain04" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="goldDark04" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="goldRing04" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Sovereign Coin Frame -->
  <rect x="24" y="24" width="464" height="464" rx="232" fill="url(#bg04)" stroke="url(#goldRing04)" stroke-width="6"/>
  <circle cx="256" cy="256" r="208" fill="none" stroke="#292524" stroke-width="2"/>

  <!-- Folded 1917 Vernam Teleprinter Tape Ribbon forming a Bold V -->
  <!-- Right Shadow Fold -->
  <polygon points="392,138 320,138 228,386 286,386" fill="url(#goldDark04)"/>
  <!-- Left Primary Lit Tape Fold -->
  <polygon points="120,138 194,138 286,386 226,386" fill="url(#goldMain04)"/>

  <!-- 5-Bit Baudot / Vernam Punched One-Time-Pad Perforations along Left Ribbon -->
  <g fill="#0B0A08">
    <circle cx="164" cy="176" r="8"/>
    <circle cx="182" cy="222" r="8"/>
    <circle cx="200" cy="268" r="8"/>
    <circle cx="218" cy="314" r="8"/>
    <circle cx="236" cy="356" r="6"/>
  </g>
  <!-- Burn-After-Reading Sparkle Dots along Right Ribbon -->
  <g fill="#FEF08A" opacity="0.85">
    <circle cx="344" cy="176" r="5"/>
    <circle cx="326" cy="222" r="4"/>
    <circle cx="308" cy="268" r="3"/>
  </g>

  <!-- Crisp Apex Cap & 21M Cap Micro-Marks -->
  <line x1="176" y1="104" x2="336" y2="104" stroke="#F59E0B" stroke-width="2" opacity="0.55"/>
  <text x="256" y="438" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" letter-spacing="8" fill="#FDE047">VRNM</text>
</svg>
